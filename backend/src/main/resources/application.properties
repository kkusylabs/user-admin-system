# Shared application configuration.
#
# This file contains settings that apply to all profiles.
# Profile-specific behavior belongs in:
# - application-dev.properties
# - application-demo.properties
# - application-client-test.properties
#
# Secrets and database connection values are expected to come from
# environment variables unless a profile provides a local/demo fallback.

# Name of the Spring Boot application.
# Used for logging, metrics, and identification in distributed systems.
spring.application.name=user-admin-app

# Port the embedded web server listens on.
# When running locally: http://localhost:8080
# When running in Docker, this is the container port (mapped via docker-compose).
server.port=8080

# JWT token lifetime in milliseconds.
# 86400000 = 24 hours.
# After expiration, clients must re-authenticate.
app.jwt.expiration-millis=86400000

# Secret key used to sign JWT tokens.
# Must be provided via environment variable (APP_JWT_SECRET).
# Do NOT hardcode secrets in source control.
app.jwt.secret=${APP_JWT_SECRET}

# Database connection URL.
# Must be provided via environment variable (DB_URL).
# Examples:
# - Local dev (IntelliJ): jdbc:postgresql://localhost:5432/user_admin_system
# - Docker Compose:       jdbc:postgresql://postgres:5432/user_admin_system
spring.datasource.url=${DB_URL}

# Database username.
# Provided via environment variable (DB_USER).
spring.datasource.username=${DB_USER}

# Database password.
# Provided via environment variable (DB_PASSWORD).
spring.datasource.password=${DB_PASSWORD}

# JDBC driver for PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate dialect for PostgreSQL.
# Ensures generated SQL is optimized for Postgres.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect