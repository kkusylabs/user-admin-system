# Development profile.
#
# Used for day-to-day local development, typically with:
# - Postgres running from compose.dev-db.yml
# - Spring Boot running from IntelliJ with the "dev" profile
#
# Data lifecycle:
# - Preserves existing data between app restarts.
# - Creates/updates tables as entities change.
# - Java seeders may add minimal starter data, but should be idempotent.
#
# This profile is intended for local development only.

app.jwt.secret=${APP_JWT_SECRET:your-super-long-random-secret-key-at-least-32-bytes}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_admin_system}
spring.datasource.username=${DB_USER:user_admin_app}
spring.datasource.password=${DB_PASSWORD:password123}

# Keeps local dev data while allowing Hibernate to adjust the schema.
# Do not rely on this as a production migration strategy.
spring.jpa.hibernate.ddl-auto=update

# Helpful while developing; can be noisy.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# API documentation is useful during local development.
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true