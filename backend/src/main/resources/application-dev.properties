# Secret key used to sign JWT tokens.
# Uses APP_JWT_SECRET if provided; otherwise falls back to a default for development.
# Replace with a strong, externally managed secret in real deployments.
app.jwt.secret=${APP_JWT_SECRET:your-super-long-random-secret-key-at-least-32-bytes}

# JDBC connection URL for the development database.
# Uses DB_URL if provided; otherwise defaults to localhost.
# Examples:
# - IntelliJ/local run: jdbc:postgresql://localhost:5432/user_admin_system
# - Docker Compose:     jdbc:postgresql://postgres:5432/user_admin_system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_admin_system}

# Database username.
# Uses DB_USER if provided; otherwise defaults to a local development user.
spring.datasource.username=${DB_USER:user_admin_app}

# Database password.
# Uses DB_PASSWORD if provided; otherwise defaults to a local development password.
spring.datasource.password=${DB_PASSWORD:password123}

# Controls how Hibernate manages the schema at startup.
# Uses DDL_AUTO if provided; otherwise defaults to "update" for development.
# Common values:
# - update       Automatically adjusts schema to match entities (dev only)
# - validate     Verifies schema matches entities without modifying it
# - none         Disables schema management
# - create-drop  Recreates schema on startup and drops it on shutdown
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Enables logging of generated SQL statements.
# Useful for debugging during development; disable in production.
spring.jpa.show-sql=true

# Formats SQL logs for readability.
spring.jpa.properties.hibernate.format_sql=true

# Disables execution of schema.sql and data.sql initialization scripts.
# Recommended when Hibernate is responsible for schema management.
spring.sql.init.mode=never

# Enables the Swagger UI web interface.
# When enabled, the interactive API documentation is available at:
# http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.enabled=true

# Enables generation of the OpenAPI specification (JSON).
# This is used by Swagger UI and can also be accessed directly at:
# http://localhost:8080/v3/api-docs
springdoc.api-docs.enabled=true