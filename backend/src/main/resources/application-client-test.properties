# Client-test profile.
#
# Used for testing a client integration against a small, predictable dataset,
# typically with compose.client-test.yml.
#
# This profile is meant to provide enough data to exercise common client
# behavior without loading a large demo database.
#
# Expected starter data:
# - A few active departments
# - One inactive/archived department
# - One admin user
# - One manager user
# - One standard user
# - One inactive user
#
# Data lifecycle:
# - Recreates the schema each time the app starts.
# - Java seeders populate deterministic client-test data.
# - No database volume is needed because the data is disposable.
#
# WARNING:
# Do not point this profile at a database you care about.

app.jwt.secret=${APP_JWT_SECRET:client-test-only-secret-key-at-least-32-bytes-long}

# WARNING: Deletes and recreates Hibernate-managed schema objects on startup.
spring.jpa.hibernate.ddl-auto=create

# Client integration testing does not need interactive API documentation.
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true