# Client-test profile.
#
# Backend fixture for Eclipse RCP client integration tests.
# Provides a small deterministic dataset through Java seeders so the client
# tests can rely on known users, roles, departments, and active/inactive states.

app.jwt.secret=${APP_JWT_SECRET:client-test-only-secret-key-at-least-32-bytes-long}

# WARNING: Deletes and recreates Hibernate-managed schema objects on startup.
spring.jpa.hibernate.ddl-auto=create

# Eclipse RCP integration tests do not need interactive API documentation.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Required for Testcontainers readiness checks during integration tests.
management.endpoints.web.exposure.include=health