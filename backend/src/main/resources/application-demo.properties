# Demo profile.
#
# Used for the public/demo backend.
# Provides a richer seeded dataset for demonstrating searching, filtering,
# sorting, pagination, and typical user-management workflows.

app.jwt.secret=${APP_JWT_SECRET:demo-only-secret-key-at-least-32-bytes-long}

# WARNING: Deletes and recreates Hibernate-managed schema objects on startup.
spring.jpa.hibernate.ddl-auto=create

# API documentation is useful for reviewers exploring the demo.
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true