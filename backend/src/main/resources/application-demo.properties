# Demo profile.
#
# Used for the public/demo version of the app, typically with compose.yml.
# This profile should show the app with a rich, realistic dataset suitable
# for demonstrating searching, filtering, pagination, and normal workflows.
#
# Data lifecycle:
# - Recreates the schema each time the app starts.
# - Java seeders should populate a full demo dataset.
# - No database volume is needed because the data is disposable.
#
# WARNING:
# Do not point this profile at a database you care about.

app.jwt.secret=${APP_JWT_SECRET:demo-only-secret-key-at-least-32-bytes-long}

# WARNING: Deletes and recreates Hibernate-managed schema objects on startup.
spring.jpa.hibernate.ddl-auto=create

# API documentation is useful for reviewers exploring the demo.
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true