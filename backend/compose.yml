# Demo backend.
# Starts the app with the "demo" profile and a disposable Postgres DB seeded
# with a richer dataset for demonstrating filtering, sorting, and pagination.
#
# Run:
#   docker compose up --build

name: user-admin-demo

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/user_admin_demo
      DB_USER: user_admin_app
      DB_PASSWORD: password123
      APP_JWT_SECRET: demo-only-secret-key-at-least-32-bytes-long
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_admin_demo
      POSTGRES_USER: user_admin_app
      POSTGRES_PASSWORD: password123