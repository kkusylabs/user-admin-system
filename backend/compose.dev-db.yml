# Development database only.
#
# Use this when running the Spring Boot app from IntelliJ with the "dev" profile:
#   docker compose -f compose.dev-db.yml up -d
#
# Starts:
# - Persistent Postgres database only
#
# The app does not run in Docker for this workflow. IntelliJ connects to:
#   jdbc:postgresql://localhost:5432/user_admin_system
#
# This database uses a named volume so local development data survives restarts.

services:
  db:
    image: postgres:16
    container_name: user-admin-dev-db
    environment:
      POSTGRES_DB: user_admin_system
      POSTGRES_USER: user_admin_app
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data

volumes:
  dev-db-data: