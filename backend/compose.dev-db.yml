# Local development database.
# Starts only Postgres for running the Spring Boot app from IntelliJ with the "dev" profile.
#
# Run:
#   docker compose -f compose.dev-db.yml up -d
name: user-admin-dev-db

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_admin_system
      POSTGRES_USER: user_admin_app
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data

volumes:
  dev-db-data: