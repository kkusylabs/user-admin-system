# Backend fixture for Eclipse RCP client integration tests.
# Starts the app with the "client-test" profile and a disposable seeded Postgres DB.
#
# Run:
#   docker compose -f compose.client-test.yml up --build

name: user-admin-client-test

services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: client-test
      DB_URL: jdbc:postgresql://db:5432/user_admin_client_test
      DB_USER: user_admin_app
      DB_PASSWORD: password123
      APP_JWT_SECRET: client-test-only-secret-key-at-least-32-bytes-long
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_admin_client_test
      POSTGRES_USER: user_admin_app
      POSTGRES_PASSWORD: password123